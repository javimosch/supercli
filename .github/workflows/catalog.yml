name: Update Plugin Catalog

on:
  push:
    branches:
      - master
    paths:
      - "plugins/**"
      - "scripts/generate-catalog.js"

jobs:
  generate-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate plugins/catalog.json
        run: node scripts/generate-catalog.js

      - name: Commit catalog if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins/catalog.json
          if git diff --cached --quiet; then
            echo "No catalog changes to commit"
          else
            git commit -m "chore: regenerate plugins/catalog.json"
            git push
          fi
