name: Release sc-machin

on:
  push:
    tags:
      - 'v*-machin'  # Trigger on tags like v0.2.0-machin, v0.3.0-machin, etc.

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-latest
            os: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Install machin
        run: |
          MACHIN_VERSION="v0.142.1"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/javimosch/machin/releases/download/${MACHIN_VERSION}/machin-${MACHIN_VERSION}-${{ matrix.os }}-${{ matrix.arch }}" -o "$HOME/.local/bin/machin"
          chmod +x "$HOME/.local/bin/machin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # machin has no --version flag; verify it runs by checking help output
          "$HOME/.local/bin/machin" guide > /dev/null 2>&1 || true
          test -x "$HOME/.local/bin/machin" && echo "machin installed"

      - name: Build sc-machin
        working-directory: ./supercli-machin-cli
        run: |
          if [ "${{ matrix.os }}" = "linux" ]; then
            # musl static + TLS needs a musl-built OpenSSL: glibc headers/libs are
            # unusable under musl-gcc (glibc bits/types conflict; glibc-compiled
            # libssl.a references glibc-internals). Build OpenSSL 3.5.9 for musl
            # once per job (~4min) and point CC at a wrapper injecting -I/-L —
            # machin execs $CC as a bare path, so flags can't ride along in CC.
            sudo apt-get update && sudo apt-get install -y musl-tools zlib1g-dev libbrotli-dev libzstd-dev perl
            OSSL_VER=3.5.9
            OSSL_SHA=603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a
            curl -fsSL -o /tmp/openssl.tar.gz "https://github.com/openssl/openssl/releases/download/openssl-${OSSL_VER}/openssl-${OSSL_VER}.tar.gz"
            echo "$OSSL_SHA  /tmp/openssl.tar.gz" | sha256sum -c -
            mkdir -p /tmp/ossl && tar xzf /tmp/openssl.tar.gz -C /tmp/ossl --strip-components=1
            MULTIARCH="$(gcc -print-multiarch)"
            case "$MULTIARCH" in
              x86_64-linux-gnu)   OSSL_TARGET=linux-x86_64 ;;
              aarch64-linux-gnu)  OSSL_TARGET=linux-aarch64 ;;
              *) echo "no openssl target for $MULTIARCH"; exit 1 ;;
            esac
            SSL=/tmp/musl-ssl
            mkdir -p "$SSL/include"
            # openssl's mem_sec.c needs kernel UAPI headers (linux/mman.h) that
            # musl-gcc's include path lacks — UAPI headers are libc-agnostic, copy.
            cp -r /usr/include/linux /usr/include/asm-generic "/usr/include/${MULTIARCH}/asm" "$SSL/include/"
            cd /tmp/ossl
            ./Configure "$OSSL_TARGET" no-shared no-tests CC=musl-gcc --prefix="$SSL" >/dev/null
            make -j"$(nproc)" CFLAGS="-I$SSL/include" build_libs >/dev/null
            make install_sw >/dev/null
            cd - >/dev/null
            # helper archives machin probes for in static+TLS mode (z/brotli/zstd):
            # glibc-built is fine — pure libc API, no glibc internals.
            cp /usr/lib/"$MULTIARCH"/libz.a /usr/lib/"$MULTIARCH"/libbrotli*.a "$SSL/lib/" 2>/dev/null || true
            cp /usr/lib/"$MULTIARCH"/libzstd.a "$SSL/lib/" 2>/dev/null || true
            printf '#!/bin/sh\nexec musl-gcc -I%s/include -L%s/lib64 -L%s/lib "$@"\n' "$SSL" "$SSL" "$SSL" > "$SSL/cc.sh"
            chmod +x "$SSL/cc.sh"
            CC="$SSL/cc.sh" bash build.sh --static
          else
            brew install openssl@3
            export OPENSSL_ROOT="$(brew --prefix openssl@3)"
            export CPATH="$OPENSSL_ROOT/include"
            export LIBRARY_PATH="$OPENSSL_ROOT/lib"
            bash build.sh
          fi
          mv sc-machin "sc-machin-${{ matrix.os }}-${{ matrix.arch }}"
          ls -lh "sc-machin-${{ matrix.os }}-${{ matrix.arch }}"

      - name: Verify binary
        working-directory: ./supercli-machin-cli
        run: |
          BINARY="sc-machin-${{ matrix.os }}-${{ matrix.arch }}"
          if [ ! -f "$BINARY" ] || [ ! -s "$BINARY" ]; then
            echo "✗ Binary missing or empty: $BINARY"
            exit 1
          fi
          ./"$BINARY" --version || { echo "✗ Binary failed to run"; exit 1; }
          if [ "${{ matrix.os }}" = "linux" ] && ! file "$BINARY" | grep -q "statically linked"; then
            echo "✗ Linux binary is not statically linked"
            exit 1
          fi
          echo "✓ Binary verified: $BINARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sc-machin-${{ matrix.os }}-${{ matrix.arch }}
          path: supercli-machin-cli/sc-machin-${{ matrix.os }}-${{ matrix.arch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Validate tag format
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-machin$ ]]; then
            echo "Error: Tag format must be vX.Y.Z-machin (e.g., v0.2.0-machin)"
            echo "Got: $VERSION"
            exit 1
          fi
          echo "✓ Tag format validated: $VERSION"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Stage release files
        run: |
          mkdir -p release
          find artifacts -name "sc-machin-*" -type f -exec cp {} release/ \;
          cp supercli-machin-cli/install.sh release/
          chmod +x release/sc-machin-*
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: SuperCLI Machin ${{ steps.version.outputs.VERSION }}
          body: |
            ## SuperCLI Machin ${{ steps.version.outputs.VERSION }}

            Single-binary SuperCLI implementation in machin (MFL) for AI agents.

            ### Installation

            ```bash
            curl -sSL https://github.com/javimosch/supercli/releases/download/${{ steps.version.outputs.VERSION }}/install.sh | bash
            ```

            Installs as `sc-machin` (co-exists with `sc` / `sc-zig`). The install script auto-detects your OS and architecture.

            ### Assets

            - `sc-machin-linux-amd64` - Linux x86_64
            - `sc-machin-linux-arm64` - Linux ARM64
            - `sc-machin-darwin-arm64` - macOS Apple Silicon
            - `install.sh` - Installation script (auto-detects platform)

            **Note:** macOS Intel (darwin-amd64) is not prebuilt — build from source if needed.

            ### Features

            - Single binary (~71KB)
            - No Node.js, no runtime dependencies
            - MCP server (`mcp serve`) — JSON-RPC 2.0 over stdio
            - `skills.match` built-in tool — semantic skill discovery
            - `rtk` passthrough — token-reduced git/ls ops
            - Cross-runtime alternatives in `--json` bootstrap

            See [README](https://github.com/javimosch/supercli/blob/master/supercli-machin-cli/README.md) for details.
          files: |
            release/sc-machin-linux-amd64
            release/sc-machin-linux-arm64
            release/sc-machin-darwin-arm64
            release/install.sh
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        if: success()
        run: |
          echo "✅ Release ${{ steps.version.outputs.VERSION }} created successfully!"
          echo "Assets: 3 binaries + install.sh"
          echo "Platforms: linux-amd64, linux-arm64, darwin-arm64"
